name: reservation-lab
services:
  postgres:
    image: postgres:18.0
    environment:
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: checkout_test
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - reservation-data:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d checkout_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  reservation-data:
