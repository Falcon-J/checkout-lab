name: Verify
'on': [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://reservation:local-test-only@127.0.0.1:5432/checkout_test?sslmode=disable
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: reservation
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: checkout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservation -d checkout_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Apply ordered migrations
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for migration in migrations/*.sql; do
            docker exec -i "$POSTGRES_CONTAINER" psql -U reservation -d checkout_test -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Formatting and modules
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod verify
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./... -count=1 -v
